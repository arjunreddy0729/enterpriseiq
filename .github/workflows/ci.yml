name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enterpriseiq
          POSTGRES_PASSWORD: enterpriseiq
          POSTGRES_DB: enterpriseiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterpriseiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: ci
      LOG_FORMAT: json
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: enterpriseiq
      POSTGRES_PASSWORD: enterpriseiq
      POSTGRES_DB: enterpriseiq
      # Test-only values for an ephemeral database. Not secrets.
      JWT_SECRET: ci-only-signing-key-for-an-ephemeral-database-0123456789
      DEMO_USER_PASSWORD: northwind-demo
      # Fail, rather than skip, if the database or corpus is missing. Before
      # this, every permission test was silently skipped in CI because the
      # corpus was never ingested.
      REQUIRE_INTEGRATION: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      # No ANTHROPIC_API_KEY in CI. Everything except generation must work
      # without one, and that is worth enforcing. The leak suite checks the
      # generation path with a scripted stub model, so CI costs nothing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only torch first: the default Linux wheel pulls ~3.5GB of CUDA.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[ml,dev]"

      # The embedding model (~440MB) is downloaded once and cached.
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ hashFiles('backend/app/core/config.py') }}

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify the migration is reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Seed identities
        run: python -m scripts.seed_users

      - name: Ingest the demo corpus
        run: python -m scripts.ingest_corpus

      - name: Run tests (including the adversarial leak suite)
        run: pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t enterpriseiq-api:ci ./backend
