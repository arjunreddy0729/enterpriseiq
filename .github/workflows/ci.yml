name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enterpriseiq
          POSTGRES_PASSWORD: enterpriseiq
          POSTGRES_DB: enterpriseiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterpriseiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: ci
      LOG_FORMAT: json
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: enterpriseiq
      POSTGRES_PASSWORD: enterpriseiq
      POSTGRES_DB: enterpriseiq
      # No ANTHROPIC_API_KEY in CI. Everything except generation must work
      # without one, and that is worth enforcing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify the migration is reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Seed identities
        run: python -m scripts.seed_users

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t enterpriseiq-api:ci ./backend
