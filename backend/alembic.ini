# Alembic configuration.
#
# NOTE: sqlalchemy.url is deliberately absent. The database URL is built from
# Settings in alembic/env.py so that the connection string exists in exactly
# one place and no credential is ever written to a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames: 0001_initial_schema.py, 0002_..., ordered on disk.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migrations are timezone-aware UTC.
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
