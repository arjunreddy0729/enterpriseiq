# ---------------------------------------------------------------------------
# EnterpriseIQ demo corpus manifest
#
# Northwind Systems, Inc. is entirely fictional. Every document under this
# directory was written for this project. No real company data appears here,
# and this corpus is safe to publish publicly.
#
# This file is the reproducible definition of the corpus AND of its permission
# topology. `access_groups` is what ends up in chunks.access_group_ids and
# therefore what the retrieval-time ACL predicate enforces. Change a value here
# and the permission tests change with it.
#
# The interesting cases, deliberately:
#   * compensation-policy.md and performance-review-process.md are [hr] only.
#     An engineering user asking about them must get an abstention, not an
#     answer - and the restricted text must never enter the model's context.
#   * procurement-thresholds.md and revenue-recognition.md are [finance] only.
#   * security-incident-legal-playbook.md is [legal] only.
#   * vendor-policy.md is [legal, finance] - a two-group document.
#   * Sofia Reyes is in engineering AND finance, so they can read the finance
#     restricted docs but not the HR ones. That exercises array overlap rather
#     than single-group matching.
# ---------------------------------------------------------------------------

version: 1
company: Northwind Systems, Inc.
description: >-
  Synthetic internal knowledge base for a fictional B2B logistics and
  embedded-payments SaaS company, used to demonstrate and benchmark
  permission-aware retrieval.

